name: Daily Postdoc Scan

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (北京时间 15:00)
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write          # 需要写权限来提交 seen_jobs.json

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run postdoc scanner
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python main.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add data/seen_jobs.json
          git diff --staged --quiet || git commit -m "chore: update seen_jobs [$(date -u +%Y-%m-%d)] [skip ci]"
          git push origin ${{ github.ref_name }} || true
